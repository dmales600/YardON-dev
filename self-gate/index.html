<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06131d">
<title>YardOn v1.0 Self Gate Check-In</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#06131d;color:#eef8fd;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;transition:background .18s ease}
body.status-ok{background:#071f13}
body.status-ok .top{background:#0a2919;border-bottom-color:#2d8b56}
body.status-error{background:#2a0b10}
body.status-error .top{background:#3a1017;border-bottom-color:#9e3942}
body.status-error .card{background:#351419;border-color:#9e3942}
body.status-error input,body.status-error textarea{background:#1c090c;border-color:#8b333c}
body.status-ok .card{background:#0d2d1b;border-color:#2d8b56}
body.status-ok input,body.status-ok textarea{background:#071b10;border-color:#35724f}
.top{padding:22px 18px 18px;background:#081b29;border-bottom:1px solid #18394d;text-align:center;position:sticky;top:0;z-index:5}
.logoimg{max-width:240px;width:65vw;height:auto;display:block;margin:0 auto 8px}
.brand{font-weight:1000;letter-spacing:.12em;font-size:25px}
.sub{font-size:12px;color:#86a9bc;margin-top:5px;font-weight:900}
.wrap{max-width:620px;margin:auto;padding:18px}
.card{background:#0b2030;border:1px solid #21495f;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px rgba(0,0,0,.18)}
.state{font-size:23px;font-weight:1000;line-height:1.15;margin:2px 0 8px}
.small{font-size:12px;line-height:1.5;color:#8eacbc}
label{display:block;margin:13px 0 6px;font-size:11px;font-weight:1000;color:#9bb7c7;letter-spacing:.04em}
input,textarea,button{width:100%;border-radius:11px;font:inherit}
input,textarea{border:1px solid #31556a;background:#071824;color:#f1f9fd;padding:14px}
textarea{min-height:86px;resize:vertical}
button{border:0;padding:14px;font-weight:1000;cursor:pointer;margin-top:12px;background:#18bd67;color:#04130a}
button:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#17374b;color:#e6f6ff}
.red{border-color:#9e3942;background:#351419}
.amber{border-color:#8b6a27;background:#342a10}
.green{border-color:#2d8b56;background:#0d2d1b}
.err{color:#ff9ca4;font-weight:900;margin-top:10px}
.spinner{width:28px;height:28px;border:3px solid #31556a;border-top-color:#eaf5fb;border-radius:50%;margin:16px auto;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.footer{padding:18px;text-align:center;color:#66879a;font-size:10px}
</style>
</head>

  <div class="sub">SELF GATE CHECK-IN</div>
</div>
<div class="wrap">
  <div id="app" class="card"><div class="spinner"></div><div class="small" style="text-align:center">Učitavanje YardOn Self Gate...</div></div>
  <div id="timeline" class="card" style="display:none">
    <b>YardOn PORUKE</b>
    <div id="events"></div>
  </div>
</div>
<div class="footer">YardOn Yard Management System</div>

<script>
'use strict';

const EDGE = 'https://rskticdbiovvgyocpzoc.supabase.co/functions/v1/yardivo-self-gate';
const params = new URLSearchParams(location.search);
const WALL = params.get('wall') || '';
const PASS = params.get('pass') || '';
const MODE = PASS ? 'pass' : 'wall';
const TOKEN = PASS || WALL;

const app = document.getElementById('app');
const timeline = document.getElementById('timeline');
const eventsHost = document.getElementById('events');

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function api(action,payload={}) {
  const r = await fetch(EDGE, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action, token:TOKEN, ...payload})
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok || d.ok === false) throw new Error(d.message || d.error || ('HTTP '+r.status));
  return d;
}
function field(id,label,placeholder='',value='') {
  return `<label for="${id}">${label}</label><input id="${id}" autocomplete="off" placeholder="${esc(placeholder)}" value="${esc(value)}">`;
}

async function loadWall() {
  if(!WALL) {
    document.body.classList.remove('status-ok');
    document.body.classList.add('status-error');
    app.className='card red';
    app.innerHTML='<div class="state">QR NIJE ISPRAVAN</div><div class="small">Nedostaje YardOn Self Gate token.</div>';
    return;
  }
  const d = await api('wall_status');
  if(!d.enabled) {
    document.body.classList.remove('status-ok');
    document.body.classList.add('status-error');
    app.className='card red';
    app.innerHTML='<div class="state">SELF CHECK-IN · NE RADI</div><div>Javite se djelatniku na Porti.</div>';
    return;
  }
  document.body.classList.remove('status-error');
  document.body.classList.add('status-ok');
  app.className='card green';
  app.innerHTML = `
    <div class="state">YardOn SELF GATE CHECK-IN</div>
    <div class="small">${esc(d.warehouseName || d.warehouse)} · skenirano na ulazu</div>
    ${field('ref','BROJ NAJAVE / BROJ NARUDŽBE','npr. broj najave')}
    ${field('plate','REGISTRACIJA VOZILA','npr. ST-123-AB')}
    ${field('driver','IME I PREZIME VOZAČA','ime i prezime')}
    <div id="err" class="err"></div>
    <button id="submit">NASTAVI</button>`;
  document.getElementById('submit').onclick = submitWall;
}

async function submitWall() {
  const btn=document.getElementById('submit'), err=document.getElementById('err');
  err.textContent='';
  btn.disabled=true; btn.textContent='ŠALJEM...';
  try {
    const d = await api('wall_submit', {
      reference:document.getElementById('ref').value.trim(),
      plate:document.getElementById('plate').value.trim(),
      driver:document.getElementById('driver').value.trim()
    });
    // Move the browser to pass/session mode on the same static page.
    location.replace(location.pathname + '?pass=' + encodeURIComponent(d.sessionToken));
  } catch(e) {
    document.body.classList.remove('status-ok');
    document.body.classList.add('status-error');
    app.className='card red';
    err.textContent=e.message;
    btn.disabled=false; btn.textContent='POKUŠAJ PONOVNO';
  }
}

function statusCard(p) {
  const cls = p.state==='REJECTED' ? 'card red' :
              p.state==='PROCEED_DOCK' ? 'card green' :
              p.state==='PARKING' ? 'card amber' : 'card';
  const title = {
    WAITING_GATE:'ČEKA ODOBRENJE PORTE',
    PARKING:'ULAZ ODOBREN · PARKING',
    PROCEED_DOCK:'IDITE NA RAMPU',
    REJECTED:'ULAZ NIJE ODOBREN',
    COMPLETED:'ZAVRŠENO'
  }[p.state] || 'YardOn SELF GATE';
  return `<div class="${cls}">
    <div class="small">${esc(p.supplier_name || '')} · ${esc(p.warehouse_name || p.warehouse || '')}</div>
    <div class="state">${title}</div>
    <div style="font-size:18px;font-weight:1000;line-height:1.35">${esc(p.last_instruction || '')}</div>
    ${p.parking_slot ? `<div class="small" style="margin-top:8px">Parking: <b>${esc(p.parking_slot)}</b></div>` : ''}
    <div class="small" style="margin-top:10px">Registracija: ${esc(p.vehicle_plate || '—')} · Vozač: ${esc(p.driver_name || '—')}</div>
  </div>
  <div class="card">
    <b>PORUKA PORTI / YardOn</b>
    <textarea id="driverMsg" placeholder="Npr. stigao sam, kasnim 20 min..."></textarea>
    <button class="secondary" id="sendMsg">POŠALJI PORUKU</button>
  </div>`;
}

async function loadPass() {
  if(!PASS) return;
  try {
    const d = await api('status');
    document.body.classList.remove('status-error');
    document.body.classList.add('status-ok');
    app.outerHTML = '<div id="app">' + statusCard(d.pass) + '</div>';
    document.getElementById('sendMsg').onclick = sendMsg;
    timeline.style.display='block';
    eventsHost.innerHTML=(d.events||[]).map(x=>`<div style="padding:10px 0;border-bottom:1px solid #18394d;font-size:13px;line-height:1.45"><b>${esc(x.actor_name||'YardOn')}</b> · ${new Date(x.created_at).toLocaleTimeString('hr-HR',{hour:'2-digit',minute:'2-digit'})}<br>${esc(x.message)}</div>`).join('') || '<div class="small">Nema novih poruka.</div>';
  } catch(e) {
    document.body.classList.remove('status-ok');
    document.body.classList.add('status-error');
    const current=document.getElementById('app');
    current.className='card red';
    current.innerHTML='<div class="state">DELIVERY PASS NIJE AKTIVAN</div><div class="small">'+esc(e.message)+'</div>';
    timeline.style.display='none';
  }
}

async function sendMsg() {
  const el=document.getElementById('driverMsg'), msg=el.value.trim();
  if(!msg) return;
  const btn=document.getElementById('sendMsg'); btn.disabled=true;
  try { await api('driver_message',{message:msg}); el.value=''; await loadPass(); }
  catch(e) { alert(e.message); btn.disabled=false; }
}

if(MODE==='wall') loadWall().catch(e=>{document.body.classList.remove('status-ok');document.body.classList.add('status-error');app.className='card red';app.innerHTML='<div class="state">GREŠKA</div><div class="small">'+esc(e.message)+'</div>'});
else {
  loadPass();
  setInterval(()=>{ if(!document.hidden) loadPass(); },5000);
}
</script>
</body>
</html>
