name: YardOn Admin Settings Final QA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yardon-admin-settings-stability-final-qa.yml"
      - "styles/yardon-admin-settings-v1.css"
      - "modules/supplier/yardivo-v583-settings-export-supplier-bulk-hard-fix.js"
      - "modules/supplier/yardivo-v583-stable-master-supplier-zero-final.js"
      - "modules/supplier/phase2-248-yardivo-v583-master-bootstrap-backend-frontend-authority-final.js"
      - "modules/master-data/yardivo-v583-production-master-cleanup-final.js"
      - "modules/services/yardivo-qr-role-control-v586.js"
      - "modules/master-data/runtime/yardivo-v583-master-popup-only-fix.js"
      - "modules/master-data/runtime/yardivo-master-single-editor-v12-js.js"
      - "modules/services/yardivo-master-admin-settings-v583.js"
      - "modules/master-data/runtime/yardivo-v583-settings-single-page-master-light-blue-authority.js"
      - "modules/master-data/phase2-258-yardivo-v583-add-user-smart-system-toggle-js.js"
      - "modules/supplier/phase2-257-yardivo-v583-smart-suppliers-accounts-fix-js.js"
      - "modules/supplier/yardivo-v583-master-data-cleanup-final-js.js"
      - "modules/master-data/runtime/yardivo-admin-cleanup-v8-js.js"
      - "modules/supplier/yardivo-supplier-location-warehouse-binding-v583.js"

permissions:
  contents: read

concurrency:
  group: yardon-admin-settings-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-flicker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static checks
        run: |
          node --check modules/supplier/yardivo-v583-settings-export-supplier-bulk-hard-fix.js
          node --check modules/supplier/yardivo-v583-stable-master-supplier-zero-final.js
          node --check modules/supplier/phase2-248-yardivo-v583-master-bootstrap-backend-frontend-authority-final.js
          node --check modules/master-data/yardivo-v583-production-master-cleanup-final.js
          node --check modules/services/yardivo-qr-role-control-v586.js
          node --check modules/master-data/runtime/yardivo-v583-master-popup-only-fix.js
          node --check modules/master-data/runtime/yardivo-master-single-editor-v12-js.js
          node --check modules/services/yardivo-master-admin-settings-v583.js
          node --check modules/master-data/runtime/yardivo-v583-settings-single-page-master-light-blue-authority.js
          node --check modules/master-data/phase2-258-yardivo-v583-add-user-smart-system-toggle-js.js
          node --check modules/supplier/phase2-257-yardivo-v583-smart-suppliers-accounts-fix-js.js
          node --check modules/supplier/yardivo-v583-master-data-cleanup-final-js.js
          node --check modules/master-data/runtime/yardivo-admin-cleanup-v8-js.js
          test -s styles/yardon-admin-settings-v1.css
          ! grep -R "MutationObserver" modules/master-data/runtime/yardivo-admin-cleanup-v8-js.js modules/supplier/yardivo-supplier-location-warehouse-binding-v583.js
          ! grep -q "yardivo:data-synced.*loadServerCfg" modules/services/yardivo-qr-role-control-v586.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Admin Settings browser stability
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/yardon-settings-final-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const HOST='https://ldzwgdwzolbvjxyznlry.supabase.co';
          const bootstrap={ok:true,state:[{key:'yardivo_qr_scan_cfg_v583',deleted:false,value_json:JSON.stringify({enabled:true,byWarehouse:{W001:{gate:true,reception:true}}})}]};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1050}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.route(HOST+'/**',async route=>{
              if(route.request().method()==='OPTIONS') return route.fulfill({status:204,headers:{'access-control-allow-origin':'*','access-control-allow-headers':'authorization,apikey,content-type,x-client-info','access-control-allow-methods':'GET,POST,PATCH,PUT,DELETE,OPTIONS'}});
              if(route.request().url().includes('/functions/v1/yardivo-sync')) return route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify(bootstrap)});
              return route.fulfill({status:200,contentType:'application/json',body:'{}'});
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1400);
            const setup=await page.evaluate(()=>{
              window.currentSession={user:'qa_admin',username:'qa_admin',role:'admin',app_role:'admin',location:'LOC001',warehouses:['W001'],serverAuthorized:true};
              try{currentSession=window.currentSession}catch(_){}
              localStorage.setItem('yardivo_master_data_registry_v583',JSON.stringify({locations:[{id:'LOC001',name:'Lokacija 1',active:true}],warehouses:[{id:'W001',name:'W201 Dugopolje',location_id:'LOC001',active:true,ramps:4,reception_from:'06:00',reception_to:'14:00',ramp_settings:[]}],suppliers:[{id:'SUP001',name:'QA Dobavljač',active:true}]}));
              document.body.dataset.yardivoRole='admin';document.documentElement.dataset.yardivoRole='admin';
              [...document.body.classList].filter(x=>/^yv-role-.*-v583$/.test(x)).forEach(x=>document.body.classList.remove(x));
              document.body.classList.add('yv-role-admin-v583');
              document.body.classList.remove('yardivo-role-switching','yardivo-prelogin');
              document.documentElement.classList.add('yardivo-login-ready','yardivo-welcome-complete');
              document.getElementById('loginOverlay')?.style.setProperty('display','none','important');
              document.getElementById('yardivoWelcomeSplash')?.style.setProperty('display','none','important');
              const app=document.querySelector('.app-shell');if(app){app.style.setProperty('display','grid','important');app.style.setProperty('visibility','visible','important')}
              window.dispatchEvent(new CustomEvent('yardivo:login',{detail:{session:window.currentSession}}));
              return {api:!!window.YardivoSettingsHardFixV583,settings:!!document.getElementById('settings')};
            });
            if(!setup.api||!setup.settings) throw new Error('Settings authority setup missing');

            await page.waitForTimeout(700);
            // This is an isolated mock-admin browser test, not a real Auth session.
            // Keep the real login overlay from reappearing and intercepting Master clicks.
            await page.addStyleTag({content:'#loginOverlay,#yardivoWelcomeSplash{display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important}'});
            await page.evaluate(()=>{
              const suppress=(el)=>{
                if(!el)return;
                el.hidden=true;el.setAttribute('aria-hidden','true');
                el.style.setProperty('display','none','important');
                el.style.setProperty('visibility','hidden','important');
                el.style.setProperty('pointer-events','none','important');
                el.style.setProperty('opacity','0','important');
              };
              const login=document.getElementById('loginOverlay'),welcome=document.getElementById('yardivoWelcomeSplash');
              suppress(login);suppress(welcome);
              if(login){const mo=new MutationObserver(()=>suppress(login));mo.observe(login,{attributes:true,attributeFilter:['class','style','hidden','aria-hidden']});window.__qaLoginOverlayGuard=mo}
              try{window.YardivoRoleStableFinal?.open?.('settings')}catch(_){}
              try{window.openAppView?.('settings')}catch(_){}
              document.querySelectorAll('.view').forEach(v=>{if(v.id!=='settings')v.classList.remove('active')});
              const s=document.getElementById('settings');
              if(s){s.classList.add('active');s.classList.remove('role-hidden');s.removeAttribute('hidden');s.removeAttribute('aria-hidden');s.style.setProperty('display','block','important');s.style.setProperty('visibility','visible','important')}
              window.dispatchEvent(new CustomEvent('yardivo:view-opened',{detail:{view:'settings'}}));
              window.YardivoSettingsHardFixV583?.refresh?.();
            });
            await page.waitForTimeout(600);

            const mounted=await page.evaluate(()=>({
              shell:!!document.getElementById('yardonAdminSettingsShell'),
              buttons:document.querySelectorAll('#yardonAdminSettingsShell .yas-sidebar button[data-yas-section]').length,
              gridInMount:document.querySelector('#yardonAdminSettingsMount > .settings-grid')!==null,
              settingsDisplay:getComputedStyle(document.getElementById('settings')).display
            }));
            if(!mounted.shell||mounted.buttons!==3||!mounted.gridInMount||mounted.settingsDisplay==='none') throw new Error('Three-section Admin Settings mount invalid '+JSON.stringify(mounted));

            await page.evaluate(()=>window.YardivoSettingsHardFixV583?.show?.('master'));
            await page.waitForTimeout(350);
            const master=await page.evaluate(()=>({
              active:document.querySelector('#yardonAdminSettingsShell .yas-sidebar button[data-yas-section="master"]')?.classList.contains('active')||false,
              pane:!!document.getElementById('yardivoSettingsMasterPaneV583'),
              paneParent:document.getElementById('yardivoSettingsMasterPaneV583')?.parentElement?.className||'',
              editor:!!document.getElementById('yardivoStableMasterEditorV583'),
              editorVisible:document.getElementById('yardivoStableMasterEditorV583')?getComputedStyle(document.getElementById('yardivoStableMasterEditorV583')).display!=='none':false,
              delayVisible:document.getElementById('yardivoDelaySettingsV1')?getComputedStyle(document.getElementById('yardivoDelaySettingsV1')).display!=='none':false
            }));
            if(!master.active||!master.pane||!master.editor||!master.editorVisible||!master.delayVisible) throw new Error('MASTER POSTAVKE empty/broken '+JSON.stringify(master));

            // Factory-zero recovery: Admin must be able to rebuild Master from 0
            // without background master events replacing the input while typing.
            await page.evaluate(()=>{
              const empty={locations:[],warehouses:[],suppliers:[],responsible_people:[],smart:{enabled:false,mode:'PAUSED'},__factoryZeroV583:true,__resetYardivoV583:true};
              localStorage.setItem('yardivo_master_data_registry_v583',JSON.stringify(empty));
              window.YardivoStableMasterV583?.render?.(true);
              window.YardivoSettingsHardFixV583?.show?.('master');
            });
            await page.waitForTimeout(180);
            if(!await page.locator('#smNewLocation').isVisible()) throw new Error('Zero-state location input not visible');
            const redrawTrace=await page.evaluate(async()=>{
              const desc=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
              const traces=[];
              Object.defineProperty(Element.prototype,'innerHTML',{
                configurable:true,
                get:desc.get,
                set:function(v){
                  if(this?.id==='yardivoStableMasterEditorV583')traces.push(new Error('STABLE_MASTER_REDRAW').stack||'no-stack');
                  return desc.set.call(this,v);
                }
              });
              const pulse=setInterval(()=>window.dispatchEvent(new CustomEvent('yardivo:master-data-changed',{detail:{source:'qa-background-pulse'}})),25);
              await new Promise(r=>setTimeout(r,350));
              clearInterval(pulse);
              Object.defineProperty(Element.prototype,'innerHTML',desc);
              return traces;
            });
            if(redrawTrace.length) throw new Error('Stable Master redrawn by background event: '+redrawTrace[0]);
            await page.evaluate(()=>{
              window.__qaMasterPulse=setInterval(()=>{
                window.dispatchEvent(new CustomEvent('yardivo:master-data-changed',{detail:{source:'qa-background-pulse'}}));
                // Simulate the exact legacy pressure that used to erase text:
                // old modules forcing a redraw/reparent while Admin is typing.
                try{window.YardivoStableMasterV583?.render?.(true)}catch(_){}
                try{window.YardivoMasterPopupOnlyV583?.refresh?.()}catch(_){}
                try{window.YardivoMasterSingleEditorV12?.apply?.()}catch(_){}
              },25);
            });
            await page.locator('#smNewLocation').focus();
            await page.locator('#smNewLocation').pressSequentially('Zagreb QA',{delay:55});
            await page.evaluate(()=>{clearInterval(window.__qaMasterPulse);window.__qaMasterPulse=0});
            const typedLocation=await page.locator('#smNewLocation').inputValue();
            if(typedLocation!=='Zagreb QA') throw new Error('Master location input lost text during background refresh: '+JSON.stringify(typedLocation));
            await page.locator('[data-sm-add-loc]').evaluate(el=>el.click());
            await page.waitForTimeout(180);
            let zeroCrud=await page.evaluate(()=>{
              const d=JSON.parse(localStorage.getItem('yardivo_master_data_registry_v583')||'{}');
              return {locations:d.locations||[],warehouses:d.warehouses||[]};
            });
            if(zeroCrud.locations.length!==1||zeroCrud.locations[0].name!=='Zagreb QA') throw new Error('Location create after reset failed '+JSON.stringify(zeroCrud));

            await page.locator('#smNewWarehouse').fill('Glavno skladište QA');
            await page.locator('#smNewWarehouseLocation').selectOption(zeroCrud.locations[0].id);
            await page.locator('[data-sm-add-wh]').evaluate(el=>el.click());
            await page.waitForTimeout(180);
            zeroCrud=await page.evaluate(()=>{
              const d=JSON.parse(localStorage.getItem('yardivo_master_data_registry_v583')||'{}');
              return {locations:d.locations||[],warehouses:d.warehouses||[]};
            });
            if(zeroCrud.warehouses.length!==1||zeroCrud.warehouses[0].name!=='Glavno skladište QA') throw new Error('Warehouse create after reset failed '+JSON.stringify(zeroCrud));
            const whId=zeroCrud.warehouses[0].id;
            const addRamp=page.locator('[data-sm-add-ramp="'+whId+'"]');
            if(!await addRamp.isVisible()) throw new Error('Ramp add action missing after warehouse create');
            await addRamp.evaluate(el=>el.click());
            await page.waitForTimeout(160);
            const masterRebuild=await page.evaluate(()=>{
              const d=JSON.parse(localStorage.getItem('yardivo_master_data_registry_v583')||'{}');
              return {locations:d.locations?.length||0,warehouses:d.warehouses?.length||0,ramps:Number(d.warehouses?.[0]?.ramps||0),locationName:d.locations?.[0]?.name||'',warehouseName:d.warehouses?.[0]?.name||''};
            });
            if(masterRebuild.locations!==1||masterRebuild.warehouses!==1||masterRebuild.ramps!==1) throw new Error('Master rebuild chain failed '+JSON.stringify(masterRebuild));

            await page.evaluate(()=>window.YardivoSettingsHardFixV583?.show?.('account'));
            await page.waitForTimeout(350);
            const account=await page.evaluate(()=>({
              active:document.querySelector('#yardonAdminSettingsShell .yas-sidebar button[data-yas-section="account"]')?.classList.contains('active')||false,
              panel:!!document.getElementById('masterUserAdmin'),
              visible:document.getElementById('masterUserAdmin')?getComputedStyle(document.getElementById('masterUserAdmin')).display!=='none':false,
              create:!!document.getElementById('muSave')||!!document.getElementById('yardivoAdminAddUserBtn'),
              list:!!document.getElementById('masterUserList')
            }));
            if(!account.active||!account.panel||!account.visible||!account.create) throw new Error('ACCOUNT POSTAVKE empty/broken '+JSON.stringify(account));

            await page.evaluate(()=>window.YardivoSettingsHardFixV583?.show?.('yardon'));
            await page.waitForTimeout(300);
            if(await page.locator('#yardivoQrRoleAdminV586').count()!==1) throw new Error('Canonical QR panel count != 1');
            if(!await page.locator('#yardivoQrRoleAdminV586').isVisible()) throw new Error('Canonical QR panel not visible in YARDON POSTAVKE');
            if(await page.locator('#yardivoQrWarehouseAdminPanelV584:visible').count()) throw new Error('Legacy QR v584 visible');
            if(await page.locator('#qrMobileSettingsPanel:visible').count()) throw new Error('Legacy QR mobile card visible');

            const baseline=await page.evaluate(()=>({children:document.querySelector('#settings .settings-grid')?.children.length||0,qr:document.querySelectorAll('#yardivoQrRoleAdminV586').length}));
            const churn=await page.evaluate(async()=>{
              const g=document.querySelector('#settings .settings-grid');let adds=0,rems=0,records=0;
              // Measure structural panel churn only. Internal table/list row refreshes are
              // valid operational updates and must not be counted as Settings flicker.
              const o=new MutationObserver(ms=>{records+=ms.length;for(const m of ms){adds+=m.addedNodes.length;rems+=m.removedNodes.length}});
              o.observe(g,{childList:true,subtree:false});
              for(let i=0;i<3;i++){window.dispatchEvent(new CustomEvent('yardivo:data-synced',{detail:{source:'qa-noop-'+i}}));await new Promise(r=>setTimeout(r,200));}
              await new Promise(r=>setTimeout(r,500));o.disconnect();return {adds,rems,records};
            });
            const after=await page.evaluate(()=>({children:document.querySelector('#settings .settings-grid')?.children.length||0,qr:document.querySelectorAll('#yardivoQrRoleAdminV586').length,ready:document.getElementById('settings')?.classList.contains('yardon-settings-ready')}));
            if(churn.adds>2||churn.rems>2) throw new Error('Settings panel flicker/churn '+JSON.stringify({baseline,churn,after}));
            if(after.qr!==1||Math.abs(after.children-baseline.children)>2||!after.ready) throw new Error('Settings unstable '+JSON.stringify({baseline,churn,after}));

            const critical=errors.filter(x=>!/rampInfo is not defined/i.test(x));if(critical.length)throw new Error('Page errors: '+critical.join(' | '));
            console.log('YARDON_ADMIN_SETTINGS_FINAL_QA_PASS',JSON.stringify({mounted,master,account,baseline,churn,after}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
