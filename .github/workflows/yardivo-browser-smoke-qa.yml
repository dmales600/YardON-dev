name: YardOn browser smoke QA

on:
  push:
    paths:
      - ".github/workflows/yardivo-browser-smoke-qa.yml"
      - "index.html"
      - "services/**"
      - "modules/**"
      - "styles/**"
      - "assets/**"
      - "manager-mobile/**"
      - "scanner/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yardon-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

# QA trigger

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run local HTTP server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/yardivo-http.log 2>&1 &
          echo $! > /tmp/yardivo-http.pid

      - name: Browser smoke tests
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const failures = [];
          const findings = [];
          const assert = (cond, msg) => { if (!cond) failures.push(msg); };
          const SUPABASE_HOST = 'https://rskticdbiovvgyocpzoc.supabase.co';

          async function sandboxSupabase(context) {
            await context.route(SUPABASE_HOST + '/**', async route => {
              const req = route.request();
              const url = req.url();
              if (req.method() === 'OPTIONS') {
                return route.fulfill({ status: 204, headers: {
                  'access-control-allow-origin':'*',
                  'access-control-allow-headers':'authorization,apikey,content-type,x-client-info',
                  'access-control-allow-methods':'GET,POST,PATCH,PUT,DELETE,OPTIONS'
                }});
              }
              if (url.includes('/auth/v1/token')) {
                return route.fulfill({ status: 400, contentType:'application/json', body: JSON.stringify({
                  error:'invalid_grant', error_description:'Invalid login credentials', msg:'Invalid login credentials'
                }) });
              }
              return route.fulfill({ status: 401, contentType:'application/json', body: JSON.stringify({ message:'QA network sandbox: live Supabase disabled' }) });
            });
            if (typeof context.routeWebSocket === 'function') {
              await context.routeWebSocket('wss://rskticdbiovvgyocpzoc.supabase.co/**', ws => ws.close());
            }
          }

          async function runViewport(browser, name, viewport) {
            const context = await browser.newContext({ viewport });
            await sandboxSupabase(context);
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const badResponses = [];

            page.on('pageerror', e => pageErrors.push(String(e.stack || e.message || e)));
            page.on('console', m => {
              if (m.type() === 'error') consoleErrors.push(m.text());
            });
            page.on('response', r => {
              const u = r.url();
              if (u.startsWith('http://127.0.0.1:4173/') && r.status() >= 400) {
                badResponses.push({ status: r.status(), url: u });
              }
            });

            const resp = await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            assert(resp && resp.ok(), `${name}: index HTTP response not OK`);

            // Strict sequential reveal: future letters must not exist in the DOM before their turn.
            const revealStage = page.locator('#yardivoWelcomeSplash .yardon-letter-reveal-stage');
            await revealStage.waitFor({ state:'attached', timeout:2500 }).catch(()=>{});
            if (await revealStage.count()) {
              const initialSegments = await page.locator('#yardivoWelcomeSplash .yardon-intro-logo-segment').count();
              assert(initialSegments <= 1, `${name}: future logo segments exist too early: ${initialSegments}`);
              await page.waitForTimeout(900);
              const earlySegments = await page.locator('#yardivoWelcomeSplash .yardon-intro-logo-segment').count();
              assert(earlySegments <= 2, `${name}: logo reveal is leaking future letters on the right: ${earlySegments}`);
            }

            // Desktop/mobile web intro must use one real transparent logo asset before split.
            const welcomeLogo = page.locator('#yardivoWelcomeSplash .yardon-welcome-logo');
            await welcomeLogo.waitFor({ state:'visible', timeout:5000 }).catch(()=>{});
            const welcomeState = await welcomeLogo.evaluate(async i => {
              const r=i.getBoundingClientRect(),cs=getComputedStyle(i);
              let darkOpaqueRatio=null, transparentRatio=null;
              try{
                if(typeof i.decode==='function')await i.decode().catch(()=>{});
                const canvas=document.createElement('canvas');
                canvas.width=i.naturalWidth;canvas.height=i.naturalHeight;
                const ctx=canvas.getContext('2d',{willReadFrequently:true});
                ctx.drawImage(i,0,0);
                const d=ctx.getImageData(0,0,canvas.width,canvas.height).data;
                let darkOpaque=0,transparent=0,total=d.length/4;
                let minX=canvas.width,minY=canvas.height,maxX=-1,maxY=-1;
                for(let p=0;p<d.length;p+=4){
                  const px=(p/4)%canvas.width,py=Math.floor((p/4)/canvas.width);
                  const a=d[p+3],m=Math.max(d[p],d[p+1],d[p+2]);
                  if(a<8)transparent++;
                  if(a>220&&m<24)darkOpaque++;
                  if(a>24){ if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py; }
                }
                darkOpaqueRatio=total?darkOpaque/total:1;
                transparentRatio=total?transparent/total:0;
                window.__yardonQaBbox=maxX>=minX&&maxY>=minY?{
                  widthRatio:(maxX-minX+1)/canvas.width,
                  heightRatio:(maxY-minY+1)/canvas.height
                }:null;
              }catch(_){}
              return {
                src:i.getAttribute('src')||'',
                complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,
                width:r.width,height:r.height,display:cs.display,visibility:cs.visibility,
                opacity:Number(cs.opacity),background:cs.backgroundColor,mixBlendMode:cs.mixBlendMode,
                darkOpaqueRatio,transparentRatio,bbox:window.__yardonQaBbox||null
              };
            });
            assert(/yardon-logo-exact\.webp/i.test(welcomeState.src), `${name}: wrong canonical welcome logo source: ${JSON.stringify(welcomeState)}`);
            assert(welcomeState.complete && welcomeState.naturalWidth>0 && welcomeState.naturalHeight>0, `${name}: welcome logo asset broken: ${JSON.stringify(welcomeState)}`);
            assert(welcomeState.width>120 && welcomeState.height>20 && welcomeState.visibility!=='hidden' && welcomeState.opacity>0, `${name}: welcome logo not visible: ${JSON.stringify(welcomeState)}`);
            assert(welcomeState.mixBlendMode==='normal', `${name}: welcome logo uses blend workaround: ${JSON.stringify(welcomeState)}`);
            assert(welcomeState.darkOpaqueRatio===null || welcomeState.darkOpaqueRatio<0.02, `${name}: welcome logo contains opaque dark frame: ${JSON.stringify(welcomeState)}`);
            assert(welcomeState.transparentRatio===null || welcomeState.transparentRatio>0.20, `${name}: welcome logo is not materially transparent: ${JSON.stringify(welcomeState)}`);
            assert(!welcomeState.bbox || (welcomeState.bbox.widthRatio>0.65 && welcomeState.bbox.heightRatio>0.40), `${name}: welcome logo content is tiny/cropped inside its asset: ${JSON.stringify(welcomeState)}`);
            const glowCount = await page.locator('#yardivoWelcomeSplash .yardon-logo-glow').count();
            assert(glowCount===2, `${name}: welcome targeted glow layers missing: ${glowCount}`);
            const progressBefore = await page.locator('#yardivoWelcomeSplash .yardivo-welcome-progress-wrap').evaluate(el => ({
              opacity:Number(getComputedStyle(el).opacity),
              ready:document.getElementById('yardivoWelcomeSplash')?.classList.contains('yardon-progress-ready')||false
            })).catch(()=>null);
            assert(!!progressBefore && progressBefore.opacity < 0.2 && !progressBefore.ready, `${name}: progress appeared before logo/tagline sequence: ${JSON.stringify(progressBefore)}`);

            await page.waitForFunction(()=>document.documentElement.classList.contains('yardivo-welcome-complete'),null,{timeout:14000}).catch(()=>{});
            await page.waitForTimeout(250);
            await page.locator('#loginUser').waitFor({ state:'visible', timeout:10000 }).catch(()=>{});
            
            assert(await page.locator('#loginUser').count() === 1, `${name}: #loginUser missing`);
            assert(await page.locator('#loginPass').count() === 1, `${name}: #loginPass missing`);
            assert(await page.locator('#loginRole').count() === 1, `${name}: #loginRole missing`);
            assert(await page.locator('#loginSubmitBtn').count() === 1, `${name}: #loginSubmitBtn missing`);
            const loginLogoState = await page.locator('.login-logo-combo img.yardon-login-logo-base').evaluate(i => {
              const r=i.getBoundingClientRect(),cs=getComputedStyle(i);
              return {src:i.getAttribute('src')||'',complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,
                width:r.width,height:r.height,display:cs.display,visibility:cs.visibility,opacity:Number(cs.opacity),
                background:cs.backgroundColor,mixBlendMode:cs.mixBlendMode,filter:cs.filter};
            }).catch(()=>null);
            assert(!!loginLogoState, `${name}: login YardOn logo missing`);
            const loginGlowCount = await page.locator('.login-logo-combo .yardon-logo-glow').count();
            assert(loginGlowCount===2, `${name}: login targeted glow layers missing: ${loginGlowCount}`);
            const loginGlowState = await page.locator('.login-logo-combo .yardon-logo-glow').evaluateAll(nodes =>
              nodes.map(n => ({opacity:Number(getComputedStyle(n).opacity),filter:getComputedStyle(n).filter}))
            );
            assert(loginGlowState.some(s => s.opacity > 0.4 && s.filter.includes('drop-shadow')), `${name}: login blue glow not visibly active: ${JSON.stringify(loginGlowState)}`);
            if(loginLogoState){
              assert(/yardon-logo-exact\.webp/i.test(loginLogoState.src), `${name}: wrong canonical login logo source: ${JSON.stringify(loginLogoState)}`);
              assert(loginLogoState.complete && loginLogoState.naturalWidth>0 && loginLogoState.naturalHeight>0, `${name}: login logo asset broken: ${JSON.stringify(loginLogoState)}`);
              assert(loginLogoState.width>120 && loginLogoState.height>20 && loginLogoState.visibility!=='hidden' && loginLogoState.opacity>0, `${name}: login logo not visibly rendered: ${JSON.stringify(loginLogoState)}`);
              assert(loginLogoState.mixBlendMode==='normal', `${name}: login logo uses blend workaround: ${JSON.stringify(loginLogoState)}`);
              assert(loginLogoState.filter && loginLogoState.filter.includes('drop-shadow'), `${name}: login base logo glow missing: ${JSON.stringify(loginLogoState)}`);
            }

            const roles = await page.locator('#loginRole option').evaluateAll(opts =>
              opts.map(o => o.value).filter(Boolean)
            );
            for (const role of ['admin','manager','inventory','reception','gate','supplier']) {
              assert(roles.includes(role), `${name}: login role missing: ${role}`);
            }

            const globals = await page.evaluate(() => ({
              supabase: !!window.YardivoSupabaseClient,
              auth: !!window.YardivoAuth,
              realtime: !!window.YardivoRealtime,
              sync: !!window.YardivoSync,
              supplier: !!window.YardivoSupplierService,
              master: !!window.YardivoMasterDataService,
              receiving: !!window.YardivoReceivingService
            }));
            for (const [k,v] of Object.entries(globals)) assert(v, `${name}: canonical global missing: ${k}`);

            // Invalid login must fail safely and keep user on login screen.
            await page.locator('#loginUser').fill('qa_invalid_user');
            await page.locator('#loginPass').fill('definitely-wrong-password');
            await page.locator('#loginRole').selectOption('admin');
            await page.locator('#loginSubmitBtn').click();
            await page.waitForTimeout(1800);
            const errorText = (await page.locator('#loginError').textContent().catch(()=>'')) || '';
            assert(errorText.trim().length > 0, `${name}: invalid login did not show an error`);
            assert(await page.locator('#loginUser').isVisible(), `${name}: invalid login left login screen unexpectedly`);

            assert(badResponses.length === 0, `${name}: local assets returned HTTP errors: ${JSON.stringify(badResponses)}`);
            assert(pageErrors.length === 0, `${name}: page errors: ${pageErrors.join(' | ')}`);

            // Filter known third-party/network console noise; local JS runtime errors remain blockers.
            const localConsoleErrors = consoleErrors.filter(x =>
              /ReferenceError|TypeError|SyntaxError|Failed to load resource.*127\.0\.0\.1/i.test(x)
            );
            assert(localConsoleErrors.length === 0, `${name}: blocking console errors: ${localConsoleErrors.join(' | ')}`);

            findings.push({ name, viewport, roles, globals, pageErrors, consoleErrors, badResponses, errorText });
            await context.close();
          }


          async function runMobileSurface(browser, name, path, authSelector) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await sandboxSupabase(context);
            const page = await context.newPage();
            const pageErrors = [];
            const brokenLocal = [];
            page.on('pageerror', e => pageErrors.push(String(e.stack || e.message || e)));
            page.on('response', r => {
              const u = r.url();
              if (u.startsWith('http://127.0.0.1:4173/') && r.status() >= 400) brokenLocal.push({status:r.status(),url:u});
            });

            const resp = await page.goto('http://127.0.0.1:4173/' + path, { waitUntil:'domcontentloaded', timeout:30000 });
            assert(resp && resp.ok(), `${name}: HTTP response not OK`);

            const boot = page.locator('#mobileBoot');
            assert(await boot.count() === 1, `${name}: #mobileBoot missing`);
            assert(await page.locator('#mobileBoot .mobile-boot-full').count() === 1, `${name}: canonical full logo missing`);
            assert(await page.locator('#mobileBootTitle').count() === 1, `${name}: canonical welcome title missing`);
            const titleText = ((await page.locator('#mobileBootTitle').textContent().catch(()=>'')) || '').replace(/\s+/g,' ').trim();
            assert(/WELCOME TO YARDON/i.test(titleText), `${name}: unexpected welcome title: ${titleText}`);
            assert(await page.locator('#mobileBootFill').count() === 1, `${name}: canonical progress fill missing`);

            const bootLogoState = await page.locator('#mobileBoot .mobile-boot-full').evaluate(i => {
              const r=i.getBoundingClientRect(),cs=getComputedStyle(i);
              return {
                complete:i.complete,
                naturalWidth:i.naturalWidth,
                naturalHeight:i.naturalHeight,
                src:i.getAttribute('src')||'',
                display:cs.display,
                visibility:cs.visibility,
                opacity:cs.opacity,
                width:r.width,
                height:r.height
              };
            });
            assert(/yardon-logo-transparent-mobile\.png/i.test(bootLogoState.src), `${name}: wrong welcome logo source: ${JSON.stringify(bootLogoState)}`);
            assert(bootLogoState.complete && bootLogoState.naturalWidth > 0 && bootLogoState.naturalHeight > 0, `${name}: welcome logo asset broken: ${JSON.stringify(bootLogoState)}`);
            assert(bootLogoState.display !== 'none' && bootLogoState.visibility !== 'hidden' && Number(bootLogoState.opacity) > 0 && bootLogoState.width > 120 && bootLogoState.height > 20, `${name}: welcome logo not visibly rendered: ${JSON.stringify(bootLogoState)}`);

            await page.locator(authSelector).waitFor({ state:'visible', timeout:10000 }).catch(()=>{});
            assert(await page.locator(authSelector).isVisible().catch(()=>false), `${name}: auth screen not visible after intro`);

            // Login intentionally starts arriving while the logo is still splitting.
            // Wait for the canonical intro completion before asserting boot is gone.
            await boot.waitFor({ state:'hidden', timeout:5000 }).catch(()=>{});
            assert(await boot.isHidden().catch(()=>false), `${name}: mobile boot did not finish/hide after split`);

            const imageState = await page.locator('img[data-yardon-logo]').evaluateAll(imgs => imgs.map(i => {
              const r=i.getBoundingClientRect(),cs=getComputedStyle(i);
              return {
                complete:i.complete,
                naturalWidth:i.naturalWidth,
                naturalHeight:i.naturalHeight,
                src:i.getAttribute('src')||'',
                display:cs.display,
                visibility:cs.visibility,
                opacity:cs.opacity,
                width:r.width,
                height:r.height
              };
            }));
            assert(imageState.length > 0, `${name}: YardOn images missing`);
            assert(imageState.every(x => x.complete && x.naturalWidth > 0 && x.naturalHeight > 0), `${name}: broken YardOn image: ${JSON.stringify(imageState)}`);
            const visibleHero = imageState.find(x => /yardon-logo-transparent-mobile\.png/i.test(x.src) && x.display !== 'none' && x.visibility !== 'hidden' && Number(x.opacity) > 0 && x.width > 120 && x.height > 20);
            assert(!!visibleHero, `${name}: visible canonical YardOn hero/login logo missing: ${JSON.stringify(imageState)}`);
            const visibleLoginLogos = await page.locator('.login-brand img[data-yardon-logo]').evaluateAll(imgs => imgs.filter(i => {
              const r=i.getBoundingClientRect(),cs=getComputedStyle(i);
              return cs.display!=='none' && cs.visibility!=='hidden' && Number(cs.opacity)>0 && r.width>40 && r.height>10;
            }).length);
            assert(visibleLoginLogos <= 1, `${name}: duplicate visible login YardOn logos: ${visibleLoginLogos}`);
            assert(pageErrors.length === 0, `${name}: page errors: ${pageErrors.join(' | ')}`);
            assert(brokenLocal.length === 0, `${name}: local HTTP errors: ${JSON.stringify(brokenLocal)}`);

            findings.push({name, path, imageState, pageErrors, brokenLocal});
            await context.close();
          }

          (async()=>{
            const browser = await chromium.launch({ headless: true });
            try {
              await runViewport(browser, 'desktop', { width: 1440, height: 1000 });
              await runViewport(browser, 'mobile', { width: 390, height: 844 });
              await runMobileSurface(browser, 'manager-mobile', 'manager-mobile/', '#auth');
              await runMobileSurface(browser, 'reception-mobile', 'scanner/?role=reception', '#auth');
            } finally {
              await browser.close();
            }

            console.log('QA_FINDINGS=' + JSON.stringify(findings));
            if (failures.length) {
              console.error('QA_FAILURES=' + JSON.stringify(failures));
              process.exit(1);
            }
            console.log('YARDON_BROWSER_SMOKE_PASS');
          })().catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE
