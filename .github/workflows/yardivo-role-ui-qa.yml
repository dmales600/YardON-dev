name: YARDIVO role UI QA
# rerun after canonical role visibility fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yardivo-role-ui-qa.yml"
      - "modules/auth/**"
      - "modules/supplier/**"
      - "modules/gate/**"
      - "modules/receiving/**"
      - "styles/**"
      - "index.html"

permissions:
  contents: read

concurrency:
  group: yardon-role-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run role UI audit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/yardivo-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const roles=['admin','manager','inventory','reception','gate','supplier'];
          const SUPABASE_HOST='https://rskticdbiovvgyocpzoc.supabase.co';
          async function sandboxSupabase(context){
            await context.route(SUPABASE_HOST+'/**',async route=>{
              const req=route.request();
              if(req.method()==='OPTIONS')return route.fulfill({status:204,headers:{'access-control-allow-origin':'*','access-control-allow-headers':'authorization,apikey,content-type,x-client-info','access-control-allow-methods':'GET,POST,PATCH,PUT,DELETE,OPTIONS'}});
              return route.fulfill({status:401,contentType:'application/json',body:JSON.stringify({message:'QA network sandbox: live Supabase disabled'})});
            });
            if(typeof context.routeWebSocket==='function')await context.routeWebSocket('wss://rskticdbiovvgyocpzoc.supabase.co/**',ws=>ws.close());
          }
          const viewports=[
            {name:'desktop',width:1440,height:1000},
            {name:'mobile',width:390,height:844}
          ];
          const sessions={
            admin:{user:'qa_admin',username:'qa_admin',role:'admin',location:'ALL',warehouses:[],serverAuthorized:true},
            manager:{user:'qa_manager',username:'qa_manager',role:'manager',location:'LOC001',warehouses:['W001'],serverAuthorized:true},
            inventory:{user:'qa_inventory',username:'qa_inventory',role:'inventory',location:'LOC001',warehouses:['W001'],serverAuthorized:true},
            reception:{user:'qa_reception',username:'qa_reception',role:'reception',location:'LOC001',warehouses:['W001'],serverAuthorized:true},
            gate:{user:'qa_gate',username:'qa_gate',role:'gate',location:'LOC001',warehouses:['W001'],serverAuthorized:true},
            supplier:{user:'qa_supplier',username:'qa_supplier',role:'supplier',location:'LOC001',warehouses:['W001'],serverAuthorized:true}
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const all=[];
            for(const vp of viewports){
              for(const role of roles){
                const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
                await sandboxSupabase(context);
                const page=await context.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push(String(e.stack||e.message||e)));
                await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2200);
                await page.evaluate(()=>{
                  window.__qaVoiceReads=[];
                  const api=window.YardivoAIVoiceNotifications;
                  if(api){
                    api.readNow=n=>{window.__qaVoiceReads.push(n)};
                    api.test=async text=>{window.__qaVoiceReads.push({body:String(text||'')});return 'qa'};
                  }
                });
                await page.evaluate(({session,role})=>{
                  window.currentSession={...session};
                  try{currentSession=window.currentSession}catch(_){}
                  document.documentElement.dataset.yardivoRole=role;
                  document.body.dataset.yardivoRole=role;
                  document.body.classList.remove('yardivo-role-switching');
                  [...document.body.classList].filter(x=>/^yv-role-.*-v583$/.test(x)).forEach(x=>document.body.classList.remove(x));
                  document.body.classList.add('yv-role-'+role+'-v583');
                  const ov=document.getElementById('loginOverlay'); if(ov)ov.style.setProperty('display','none','important');
                  const splash=document.getElementById('yardivoWelcomeSplash'); if(splash)splash.style.setProperty('display','none','important');
                  const shell=document.querySelector('.app-shell'); if(shell){shell.style.setProperty('visibility','visible','important');shell.style.setProperty('display','grid','important');}
                  window.dispatchEvent(new CustomEvent('yardivo:login',{detail:{session:window.currentSession}}));
                  window.dispatchEvent(new CustomEvent('yardivo:data-synced'));
                  window.dispatchEvent(new CustomEvent('yardivo:online-ready'));
                  document.body.classList.remove('yardivo-role-switching');
                },{session:sessions[role],role});
                await page.waitForTimeout(1500);
                if(role==='manager'){
                  await page.evaluate(()=>window.YardivoRoleStableFinal?.open?.('homeMenu'));
                  await page.waitForTimeout(250);
                }

                if(role==='inventory'){
                  await page.evaluate(()=>{
                    window.activeWarehouse='W001';
                    try{localStorage.setItem('yardivo_active_warehouse','W001')}catch(_){}
                    const n={
                      id:'QA-SUPREQ-1',
                      event:'SUPPLIER_REQUEST',
                      title:'NOVA NAJAVA DOBAVLJAČA',
                      body:'QA Dobavljač · 2026-09-26 14:30',
                      warehouse:'W001',
                      createdAt:new Date().toISOString(),
                      at:new Date().toISOString(),
                      readBy:{}
                    };
                    const list=window.YardivoNotifications?.load?.()||[];
                    window.YardivoNotifications?.save?.([...list.filter(x=>x.id!=='QA-SUPREQ-1'),n]);
                    window.dispatchEvent(new CustomEvent('yardivo:data-synced',{detail:{source:'qa-supplier-request'}}));
                  });
                  await page.waitForTimeout(220);
                  const toastCount=await page.locator('.y5-toast').count();
                  if(toastCount<1)errors.push('Inventory supplier request did not create side toast');
                }
                const voiceReads=await page.evaluate(()=>window.__qaVoiceReads||[]);
                const forecastReads=voiceReads.filter(n=>/Danas imate/i.test(String(n?.body||'')));
                if(role==='reception'&&forecastReads.length!==1)errors.push('Reception login forecast voice count='+forecastReads.length);
                if(role!=='reception'&&forecastReads.length!==0)errors.push(role+' received Reception-only login forecast voice');
                if(role==='inventory'){
                  const supplierReads=voiceReads.filter(n=>String(n?.event||'').toUpperCase()==='SUPPLIER_REQUEST'||/NOVA NAJAVA DOBAVLJAČA/i.test(String(n?.title||'')));
                  if(supplierReads.length!==1)errors.push('Inventory supplier-request priority voice count='+supplierReads.length);
                }

                const snap=await page.evaluate(()=>{
                  const visible=el=>{
                    if(!el)return false;
                    const s=getComputedStyle(el);
                    const r=el.getBoundingClientRect();
                    return s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'&&r.width>0&&r.height>0;
                  };
                  const txt=el=>(el?.innerText||el?.textContent||'').replace(/\s+/g,' ').trim();
                  const nav=[...document.querySelectorAll('.nav-btn')].filter(visible).map(el=>({view:el.dataset.view||'',text:txt(el)}));
                  const home=[...document.querySelectorAll('[data-home-target]')].filter(visible).map(el=>({target:el.dataset.homeTarget||'',text:txt(el)}));
                  const visibleSettings=[...document.querySelectorAll('#settings .panel, #settings [data-settings-tab], #settings button, #settings select, #settings input')]
                    .filter(visible).slice(0,80).map(el=>txt(el)).filter(Boolean);
                  const ids=[...document.querySelectorAll('[id]')].map(el=>el.id);
                  const dup=[...new Set(ids.filter((id,i)=>ids.indexOf(id)!==i))];
                  const body=document.body;
                  const html=document.documentElement;
                  return {
                    nav,home,visibleSettings,dupIds:dup,
                    overflowX:Math.max(body.scrollWidth,html.scrollWidth)-window.innerWidth,
                    viewport:{w:innerWidth,h:innerHeight},
                    loginVisible:visible(document.getElementById('loginOverlay')),
                    shellVisible:visible(document.querySelector('.app-shell')),
                    pageTitle:txt(document.getElementById('pageTitle')),
                    userLabel:txt(document.getElementById('currentUserLabel')),
                    warehouseVisible:visible(document.getElementById('globalWarehouse')),
                    warehouseOptions:[...document.querySelectorAll('#globalWarehouse option')].map(o=>({value:o.value,text:txt(o)})),
                    bodyRole:document.body.dataset.yardivoRole||'',
                    htmlRole:document.documentElement.dataset.yardivoRole||''
                  };
                });
                all.push({viewport:vp.name,role,errors,snap});
                await context.close();
              }
            }
            await browser.close();
            console.log('ROLE_UI_RESULTS='+JSON.stringify(all));
            console.log('YARDIVO_ROLE_UI_QA_DONE');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
