name: YARD ON Stable Planner QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/_shared/yardon-stable-planner-v1.mjs"
      - "supabase/functions/yardivo-ai-operations/index.ts"
      - ".github/qa/yardon-stable-planner-v1.test.mjs"
      - ".github/workflows/yardon-stable-planner-qa.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/_shared/yardon-stable-planner-v1.mjs"
      - "supabase/functions/yardivo-ai-operations/index.ts"
      - ".github/qa/yardon-stable-planner-v1.test.mjs"

permissions:
  contents: read

jobs:
  stable-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check planner syntax
        run: node --check supabase/functions/_shared/yardon-stable-planner-v1.mjs
      - name: Run stable weekly scheduling scenarios
        run: node --test .github/qa/yardon-stable-planner-v1.test.mjs
      - name: Verify preview actions are scoped and read-only
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const s=fs.readFileSync('supabase/functions/yardivo-ai-operations/index.ts','utf8');
          const a=s.indexOf('async function stablePreview('),b=s.indexOf('\nDeno.serve(',a);
          assert(a>=0&&b>a,'Missing stable preview implementation');
          const scope=s.slice(a,b);
          assert(scope.includes('allowedWarehouses(p,m)'),'Missing warehouse access control');
          assert(scope.includes('canonicalSupplier('),'Missing Master supplier filter');
          assert(!/\.update\(|\.insert\(|\.upsert\(|writeState\(/.test(scope),'Preview must not mutate data');
          assert(s.includes('action==="stable_preview_week"'));
          console.log('STABLE_PREVIEW_API_GUARD_PASS');
          NODE
