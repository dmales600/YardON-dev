name: YardOn AI Operations QA

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - ".github/workflows/yardon-ai-operations-qa.yml"
      - "index.html"
      - "modules/supplier/script-022.js"
      - "modules/master-data/yardivo-master-data-registry.js"
      - ".github/qa/yardon-frontend-stability.test.cjs"
      - "styles/yardon-ai-operations-v1.css"
      - "modules/ai/yardon-ai-operations-v1.js"
      - "modules/legacy/yardivo-v583-timeline-next-arrivals-js.js"
      - "modules/settings/phase2-150-yardivo-smart-admin-setting-v1-20260902.js"
      - "modules/receiving/service.js"
      - "modules/operations/yardon-ai-plan-map-authority-v1.js"
      - "supabase/functions/yardivo-yard-dispatch/index.ts"
      - "supabase/functions/yardivo-ai-operations/index.ts"
      - "supabase/functions/yardivo-ai/index.ts"
      - "modules/auth/role-visibility.js"
      - "modules/supplier/yardivo-role-stability-final-v6-20260902-js.js"
      - "modules/supplier/yardivo-clean-operational-core.js"
      - "modules/master-data/script-024.js"
      - "modules/supplier/yardivo-manager-assignment-system-v583.js"
      - "modules/supplier/yardivo-manager-final-authority-v4.js"
      - "modules/supplier/yardivo-manager-scope-popup-v2.js"
      - "modules/supplier/phase2-309-yardivo-manager-single-view-hard-lock-v5.js"
      - "modules/receiving/runtime/yardivo-manager-section-authority-v583.js"

permissions:
  contents: read

concurrency:
  group: yardon-ai-operations-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check AI Operations
        run: |
          node --check modules/smart/yardon-smart-center-v1.js
          node --check modules/legacy/yardivo-v583-timeline-next-arrivals-js.js
          node --check modules/settings/phase2-150-yardivo-smart-admin-setting-v1-20260902.js
          node --check modules/receiving/service.js
          node --check modules/operations/yardon-ai-plan-map-authority-v1.js
          test -s styles/yardon-ai-operations-v1.css
          grep -q "AI_CONTROL_OFF" supabase/functions/yardivo-yard-dispatch/index.ts
          grep -q "AI_CONTROL_OFF" supabase/functions/yardivo-ai-operations/index.ts
          grep -q "GEMINI_FALLBACK" supabase/functions/yardivo-ai-operations/index.ts
          grep -q "dedupeNormalized" supabase/functions/yardivo-ai-operations/index.ts
          grep -q "PENDING_INVENTORY" supabase/functions/yardivo-ai-operations/index.ts
          grep -q "AI_RAMP_CHANGE_REQUEST" supabase/functions/yardivo-ai-operations/index.ts
          grep -q "ASSISTANT_DISABLED_BY_ADMIN" supabase/functions/yardivo-ai/index.ts
          grep -q "yardivoAiAssistantToggle" modules/settings/phase2-150-yardivo-smart-admin-setting-v1-20260902.js
          grep -q "yardivoAiControlToggle" modules/settings/phase2-150-yardivo-smart-admin-setting-v1-20260902.js
          ! grep -q '<button class="nav-btn" data-view="aiOperations"' index.html
          grep -q 'id="smartReplanning"' index.html
          ! grep -q 'id="aiOperations"' index.html
          grep -q 'yardon-smart-center-v1.js' index.html
      - name: Frontend stability regression
        run: |
          node --check modules/supplier/script-022.js
          node --check modules/master-data/script-024.js
          node --check modules/master-data/yardivo-master-data-registry.js
          node --check modules/smart/yardon-smart-center-v1.js
          node .github/qa/yardon-frontend-stability.test.cjs
          node .github/qa/yardon-ui-single-owner.test.cjs
          node .github/qa/yardon-active-manifest.test.cjs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA
        run: |
          printf '<!doctype html><html><body>QA EMPTY</body></html>' > qa-ai-empty.html
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/yardon-ai-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const HOST='https://ldzwgdwzolbvjxyznlry.supabase.co';
          const mock={
            ok:true,
            data:{
              date:'2026-09-30',
              generated_at:'2026-09-29T20:00:00.000Z',
              warehouses:[{
                id:'W001',name:'W201',location_id:'LOC001',reception_from:'06:00',reception_to:'14:00',
                ramps:[
                  {number:1,name:'Rampa 1',from:'06:00',to:'14:00',pallets_per_hour:33},
                  {number:2,name:'Rampa 2',from:'06:00',to:'14:00',pallets_per_hour:33},
                  {number:3,name:'Rampa 3',from:'06:00',to:'14:00',pallets_per_hour:33}
                ]
              }],
              plan:[
                {id:'A1',supplier:'Supplier A',warehouse:'W001',date:'2026-09-30',time:'06:00',pallets:20,planned_dock:1,planned_start:'06:00',planned_end:'06:45',duration_minutes:45,shift_minutes:0,parking_risk:false,predicted_parking:null,status:'Najavljen'},
                {id:'A2',supplier:'Supplier B',warehouse:'W001',date:'2026-09-30',time:'06:00',pallets:30,planned_dock:2,planned_start:'06:00',planned_end:'07:00',duration_minutes:60,shift_minutes:0,parking_risk:false,predicted_parking:null,status:'Najavljen'},
                {id:'A3',supplier:'Supplier C',warehouse:'W001',date:'2026-09-30',time:'06:30',pallets:25,planned_dock:1,planned_start:'06:45',planned_end:'07:30',duration_minutes:45,shift_minutes:15,parking_risk:true,predicted_parking:'P1',status:'Najavljen'}
              ],
              passes:[
                {id:'P1',announcement_id:'A3',warehouse:'W001',supplier_name:'Supplier C',dock:null,parking_slot:'P23',state:'PARKING',vehicle_plate:'ZG1234AA',checked_in_at:'2026-09-30T06:25:00Z',completed_at:null}
              ],
              decisions:[{
                id:'D1',at:'2026-09-30T06:10:00Z',supplier:'Supplier C',problemType:'LATE',
                old:{date:'2026-09-30',time:'06:30',dock:2},newSlot:{date:'2026-09-30',time:'06:45',dock:1},
                reason:'R2 je zauzeta dulje od plana.',status:'PENDING_INVENTORY'
              }],
              parking:{capacity:42,occupied:['P23'],free:41},
              summary:{total:3,assigned:3,waiting:1,no_capacity:0,utilization_pct:31}
            }
          };
          async function prepare(page,role){
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.route(HOST+'/**',async route=>{
              const url=route.request().url();
              if(url.includes('/functions/v1/yardivo-ai-operations')){
                return route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*','access-control-allow-headers':'authorization,apikey,content-type,x-client-info'},body:JSON.stringify(mock)});
              }
              if(route.request().method()==='OPTIONS')return route.fulfill({status:204,headers:{'access-control-allow-origin':'*','access-control-allow-headers':'authorization,apikey,content-type,x-client-info','access-control-allow-methods':'GET,POST,PATCH,PUT,DELETE,OPTIONS'}});
              return route.fulfill({status:401,contentType:'application/json',body:'{"message":"QA sandbox"}'});
            });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1800);
            await page.evaluate(role=>{
              localStorage.setItem('yardivo_auto_replan_cfg_v1',JSON.stringify({enabled:true,mode:'AUTO_SAFE',assistantEnabled:true}));
              window.currentSession={user:'qa_'+role,username:'qa_'+role,role,app_role:role,location:'LOC001',warehouses:['W001'],serverAuthorized:true};
              try{currentSession=window.currentSession}catch(_){}
              document.body.dataset.yardivoRole=role;
              document.documentElement.dataset.yardivoRole=role;
              [...document.body.classList].filter(x=>/^yv-role-.*-v583$/.test(x)).forEach(x=>document.body.classList.remove(x));
              document.body.classList.add('yv-role-'+role+'-v583');
              document.getElementById('loginOverlay')?.style.setProperty('display','none','important');
              document.getElementById('yardivoWelcomeSplash')?.style.setProperty('display','none','important');
              const shell=document.querySelector('.app-shell');
              if(shell){shell.style.setProperty('visibility','visible','important');shell.style.setProperty('display','grid','important');}
              document.body.classList.remove('yardivo-role-switching','yardivo-prelogin');
              document.documentElement.classList.add('yardivo-login-ready','yardivo-welcome-complete');
              window.dispatchEvent(new CustomEvent('yardivo:login',{detail:{session:window.currentSession}}));
              window.dispatchEvent(new CustomEvent('yardivo:data-synced'));
              window.dispatchEvent(new CustomEvent('yardivo:online-ready'));
              try{window.YardivoRoleVisibility?.apply?.()}catch(_){}
              try{window.YardivoRoleStableFinal?.apply?.()}catch(_){}
              document.body.classList.remove('yardivo-role-switching');
            },role);
            await page.waitForTimeout(1100);
            return errors;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            // Duplicate AI screens are retired; SMART continues working in background.
            // Verify that repeated syncs cannot repaint navigation or home-menu cards.
            for(const role of ['admin','inventory','reception','manager']){
              const context=await browser.newContext({viewport:{width:1440,height:1000}});
              const page=await context.newPage();
              const errors=await prepare(page,role);
              await page.waitForTimeout(500);
              const state=await page.evaluate(async role=>{
                const retired=!document.getElementById('aiOperations')&&
                  !document.querySelector('.nav-btn[data-view="aiOperations"]')&&
                  !document.querySelector('[data-home-target="aiOperations"]');
                const showSmart=['admin','inventory','reception'].includes(role);
                const nav=document.querySelector('.nav-btn[data-view="smartReplanning"]');
                const card=document.querySelector('[data-home-target="smartReplanning"]');
                const smartVisibility=!!nav&&!!card&&
                  (getComputedStyle(nav).display!=='none')===showSmart&&
                  (getComputedStyle(card).display!=='none')===showSmart;
                const singleView=document.querySelectorAll('#smartReplanning').length===1;
                // Allow first authorization reconciliation to complete before measuring
                // repeated background syncs (do not count legitimate initial menu setup).
                window.dispatchEvent(new CustomEvent('yardivo:data-synced'));
                await new Promise(resolve=>setTimeout(resolve,650));
                const nodes=[document.querySelector('.nav'),document.getElementById('homeMenuGrid')].filter(Boolean);
                let changed=0;const names={};const transitions=[];let round=0;
                const watchers=nodes.map(node=>{
                  const watcher=new MutationObserver(ms=>{const menuChanges=ms.filter(m=>{
                      const el=m.target;
                      if(m.type==='childList')return el?.id==='homeMenuGrid'||el?.classList?.contains('nav');
                      return el?.matches?.('.nav-btn,.home-menu-card');
                    });
                    changed+=menuChanges.length;menuChanges.forEach(m=>{const k=(m.target?.dataset?.view||m.target?.dataset?.homeTarget||m.target?.id||m.target?.className||'?')+':'+m.attributeName;names[k]=(names[k]||0)+1;if(m.target?.dataset?.view==='epal')transitions.push({round,attr:m.attributeName,old:m.oldValue,now:m.target.getAttribute(m.attributeName)})})});
                  watcher.observe(node,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style','hidden'],attributeOldValue:true});
                  return watcher;
                });
                for(let i=0;i<4;i++){
                  round=i+1;
                  window.dispatchEvent(new CustomEvent('yardivo:data-synced'));
                  await new Promise(resolve=>setTimeout(resolve,200));
                }
                await new Promise(resolve=>setTimeout(resolve,700));
                watchers.forEach(w=>w.disconnect());
                return {retired,smartVisibility,singleView,changed,top:Object.entries(names).sort((a,b)=>b[1]-a[1]).slice(0,15),transitions};
              },role);
              if(!state.retired||!state.smartVisibility||!state.singleView)throw new Error(role+' SMART visibility/retired AI Operations conflict '+JSON.stringify(state));
              if(state.changed>0)throw new Error(role+' menu flickered on repeated syncs: '+state.changed+' DOM mutations '+JSON.stringify(state.top)+' transitions '+JSON.stringify(state.transitions));
              if(errors.length)throw new Error(role+' page errors: '+errors.join(' | '));
              await context.close();
            }
            for(const role of ['gate','supplier']){
              const context=await browser.newContext({viewport:{width:1280,height:900}});
              const page=await context.newPage();
              const errors=await prepare(page,role);
              const navVisible=await page.locator('.nav-btn[data-view="aiOperations"]').isVisible();
              const homeVisible=await page.locator('[data-home-target="aiOperations"]').isVisible();
              if(navVisible||homeVisible)throw new Error(role+' must not see AI Operations');
              if(await page.locator('.nav-btn[data-view="smartReplanning"]').isVisible())throw new Error(role+' must not see SMART');
              if(errors.length)throw new Error(role+' page errors: '+errors.join(' | '));
              await context.close();
            }

            {
              const context=await browser.newContext({viewport:{width:1440,height:1000}});
              const page=await context.newPage();
              const errors=await prepare(page,'inventory');
              await page.evaluate(()=>{
                localStorage.setItem('yardivo_auto_replan_cfg_v1',JSON.stringify({enabled:false,mode:'PAUSED',assistantEnabled:false}));
                window.dispatchEvent(new CustomEvent('yardivo:ai-admin-config',{detail:{enabled:false,mode:'PAUSED',assistantEnabled:false}}));
                window.YardOnSmartCenter?.refresh?.();
                window.YardivoSmartOperationalVisibilityV583?.apply?.();
                window.YardivoSmartAssistantV583?.applyAvailability?.();
              });
              await page.waitForTimeout(120);
              if(!(await page.locator('.nav-btn[data-view="smartReplanning"]').isVisible())){
                const debug=await page.evaluate(()=>{
                  const el=document.querySelector('.nav-btn[data-view="smartReplanning"]');
                  return {exists:!!el,role:window.currentSession?.role,body:document.body.className,
                    html:document.documentElement.className,classes:el?.className,
                    style:el?.getAttribute('style'),computed:el?getComputedStyle(el).display:'missing',
                    parent:el?.parentElement?.getAttribute('style'),
                    matrix:window.YardivoRoleVisibility?.allowed?.('smartReplanning')};
                });
                throw new Error('SMART menu must remain visible while engine is paused: '+JSON.stringify(debug));
              }
              if(!(await page.locator('[data-home-target="smartReplanning"]').isVisible()))throw new Error('SMART history must remain accessible while paused');
              if(await page.locator('#yardivoAssistantZone').isVisible())throw new Error('Assistant hover zone must hide when Admin Assistant is OFF');
              if(await page.locator('#yardivoSmartAssistant').isVisible())throw new Error('Assistant panel must hide when Admin Assistant is OFF');
              const state=await page.evaluate(async()=>({
                ai:window.YardOnAIOperations?.enabled?.(),
                assistant:window.YardivoSmartAssistantV583?.enabled?.(),
                inventoryCanEnable:await window.YardivoSmartAssistantV583?.setEnabled?.(true)
              }));
              if(state.ai!==false)throw new Error('AI Operations runtime still reports enabled while Admin AI control is OFF');
              if(state.assistant!==false)throw new Error('Assistant runtime still reports enabled while Admin Assistant is OFF');
              if(state.inventoryCanEnable!==false)throw new Error('Inventory must not be able to enable Assistant');
              if(errors.length)throw new Error('AI OFF page errors: '+errors.join(' | '));
              await context.close();
            }

            {
              const context=await browser.newContext({viewport:{width:1440,height:1000}});
              const page=await context.newPage();
              const errors=await prepare(page,'admin');
              await page.evaluate(()=>{
                window.YardOnAIAdminV1?.inject?.();
                window.YardivoSettingsHardFixV583?.show?.('yardon');
              });
              await page.waitForTimeout(120);
              if(await page.locator('#yardivoAiAssistantToggle').count()!==1)throw new Error('Admin YardOn Assistant toggle missing');
              if(await page.locator('#yardivoAiControlToggle').count()!==1)throw new Error('Admin AI control toggle missing');
              if(errors.length)throw new Error('Admin settings page errors: '+errors.join(' | '));
              await context.close();
            }
            {
              const page=await browser.newPage({viewport:{width:1200,height:800}});
              await page.goto('http://127.0.0.1:4173/qa-ai-empty.html',{waitUntil:'domcontentloaded'});
              const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
              await page.setContent(`<!doctype html><html><body>
                <div id="yardivoTodayTimelineZone"></div>
                <script>
                  window.currentSession={role:'inventory',app_role:'inventory',warehouses:['W001']};
                  window.yardivoLocalDateV583=()=>'${today}';
                  window.yardivoCanonicalWarehouseV583=()=> 'W001';
                  let announcements=[
                    {id:'A-LATE',supplierDeliveryId:'DEL-1',supplier:'dobavljač2',date:'${today}',time:'06:00',warehouse:'W001',pallets:15,status:'Kašnjenje',plannedDock:'R1',updatedAt:'${today}T07:00:00'},
                    {id:'A-LATE-DUP',supplierDeliveryId:'DEL-1',supplier:'dobavljač2',date:'${today}',time:'06:00',warehouse:'W001',pallets:15,status:'Stigao',plannedDock:'R1',updatedAt:'${today}T07:05:00'}
                  ];
                  localStorage.setItem('yardivo_master_data_registry_v583',JSON.stringify({suppliers:[{name:'dobavljač2',active:true}]}));
                </script>
              </body></html>`);
              await page.addScriptTag({path:'modules/legacy/yardivo-v583-timeline-next-arrivals-js.js'});
              await page.waitForTimeout(80);
              const state=await page.evaluate(()=>({
                summary:document.querySelector('#yardivoTodayTimeline .yv-tl-summary b')?.textContent||'',
                text:document.querySelector('#yardivoTodayTimeline')?.textContent||''
              }));
              if(!/^1 dolazaka danas/.test(state.summary))throw new Error('Today Timeline must count one deduplicated late arrival, got: '+state.summary);
              if(!/dobavljač2/i.test(state.text))throw new Error('Today Timeline missing dobavljač2');
              if(!/R1/.test(state.text))throw new Error('Today Timeline missing AI planned R1');
              await page.close();
            }

            await browser.close();
            console.log('YARDON_AI_OPERATIONS_QA_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
